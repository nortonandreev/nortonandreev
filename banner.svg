<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071f35"/>
      <stop offset="100%" stop-color="#0b2c4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#16588f" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#16588f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="108%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#2874b2" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#2874b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1200" height="220" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="220" rx="20" fill="url(#glow2)"/>
  <rect width="1200" height="220" rx="20" fill="url(#dots)" mask="url(#dotmask)"/>
  <text x="56" y="86" fill="#ffffff" fill-opacity="0.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.8">NORTON ANDREEV</text>
  <text x="56" y="146" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="-0.6">Senior Product Engineer</text>
</svg>
