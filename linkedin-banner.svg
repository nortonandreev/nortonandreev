<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071f35"/>
      <stop offset="100%" stop-color="#0b2c4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#16588f" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#16588f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#2874b2" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#2874b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
