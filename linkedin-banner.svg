  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>
  <rect width="1584" height="396" fill="url(#glow2)"/>
  <rect width="1584" height="396" fill="url(#dots)" mask="url(#dotmask)"/>
  <text x="792" y="158" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.4">NORTON ANDREEV</text>
  <text x="792" y="224" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-0.8">Senior Product Engineer</text>
  <text x="792" y="276" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400">Web and desktop products</text>
